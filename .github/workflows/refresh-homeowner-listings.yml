name: Refresh public listing pages

# Rebuild the homeowner site once a day so new public listings get their own
# HTML page and a sitemap entry without anyone starting a deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9.14.2'

jobs:
  refresh-homeowner:
    name: Rebuild and publish homeowner web
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://buildmyhouse.app
    env:
      AWS_REGION: eu-north-1
      AWS_S3_BUCKET_HOMEOWNER: ${{ secrets.AWS_S3_BUCKET_HOMEOWNER }}
      AWS_CLOUDFRONT_HOMEOWNER_ID: ${{ secrets.AWS_CLOUDFRONT_HOMEOWNER_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_WEB_URL: https://buildmyhouse.app
      EXPO_PUBLIC_GSC_VERIFICATION: oXMp0QHWTK-YkDQ5L8sNre1YHVZR_6Tt7VBUP8DQ5X8
      EXPO_PUBLIC_GA_MEASUREMENT_ID: G-WWK0DNZNSM
      EXPO_PUBLIC_REDDIT_PIXEL_ID: a2_j7dn8awnmze0
      EXPO_PUBLIC_TRUSTINDEX_WIDGET_ID: 17e626a84365332f60662d4eea6
      EXPO_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID: ${{ secrets.EXPO_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_S3_BUCKET_HOMEOWNER != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL for build
        id: homeowner-api-url
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          API_URL="${API_URL:-https://api.buildmyhouse.app}"
          API_URL="${API_URL%/}"
          if [[ "$API_URL" != */api ]]; then
            API_URL="$API_URL/api"
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Validate Google OAuth client secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_CLIENT_ID" ]; then
            echo "Missing PRODUCTION_GOOGLE_CLIENT_ID GitHub secret"
            exit 1
          fi

      - name: Build homeowner web app
        run: |
          EXPO_PUBLIC_API_URL=${{ steps.homeowner-api-url.outputs.api_url }} \
          EXPO_PUBLIC_WEB_URL=${{ env.EXPO_PUBLIC_WEB_URL }} \
          EXPO_PUBLIC_GSC_VERIFICATION=${{ env.EXPO_PUBLIC_GSC_VERIFICATION }} \
          EXPO_PUBLIC_GA_MEASUREMENT_ID=${{ env.EXPO_PUBLIC_GA_MEASUREMENT_ID }} \
          EXPO_PUBLIC_REDDIT_PIXEL_ID=${{ env.EXPO_PUBLIC_REDDIT_PIXEL_ID }} \
          EXPO_PUBLIC_TRUSTINDEX_WIDGET_ID=${{ env.EXPO_PUBLIC_TRUSTINDEX_WIDGET_ID }} \
          EXPO_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID=${{ env.EXPO_PUBLIC_TRUSTPILOT_BUSINESS_UNIT_ID }} \
          pnpm --filter mobile-homeowner build

      - name: Sync CloudFront legacy redirects
        if: env.AWS_S3_BUCKET_HOMEOWNER != ''
        continue-on-error: true
        env:
          AWS_CLOUDFRONT_HOMEOWNER_ID: ${{ secrets.AWS_CLOUDFRONT_HOMEOWNER_ID }}
        working-directory: apps/mobile-homeowner
        run: node ./scripts/sync-cloudfront-redirects.mjs

      - name: Deploy to S3
        if: env.AWS_S3_BUCKET_HOMEOWNER != ''
        working-directory: apps/mobile-homeowner
        run: node ./scripts/publish-web-assets.mjs

      - name: Invalidate CloudFront
        if: env.AWS_S3_BUCKET_HOMEOWNER != '' && env.AWS_CLOUDFRONT_HOMEOWNER_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id "$AWS_CLOUDFRONT_HOMEOWNER_ID" --paths "/*" --region "$AWS_REGION"
